<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lowtree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  /* Instrument panel in moss-ink with a resin-amber accent; the viewport is a pale meadow sky.
     Layout: full-bleed 3D viewport left, 344px control column right, herbarium label pinned in the viewport. */
  --panel:#151a16;
  --panel-2:#1c231e;
  --line:#2b352e;
  --text:#e5e8dc;
  --muted:#939d90;
  --accent:#e2a23a;
  --paper:#f2f0e6;
  --ink:#1b1d18;
  --stamp:#a5402a;
  --f-display:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-ui:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--text);font-family:var(--f-ui);font-size:13px;line-height:1.35;overflow:hidden}
#app{display:grid;grid-template-columns:minmax(0,1fr) 344px;height:100%}
#stage{position:relative;overflow:hidden;background:#dfe1d6;min-height:0}
#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
#gl.drag{cursor:grabbing}
.brand{position:absolute;left:20px;top:14px;pointer-events:none;color:var(--ink)}
.brand h1{margin:0;font-family:var(--f-display);font-style:italic;font-weight:500;font-size:34px;letter-spacing:-0.01em;line-height:1}
.brand .home{display:inline-block;margin-bottom:6px;pointer-events:auto;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);opacity:.7;text-decoration:none}
.brand .home:hover,.brand .home:focus-visible{opacity:1;text-decoration:underline}
.brand .home[hidden]{display:none}
.brand p{margin:4px 0 0;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.62}
.toolbar{position:absolute;right:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 220px)}
.tb{font:500 12px/1 var(--f-ui);letter-spacing:.02em;color:var(--ink);background:rgba(242,240,230,.82);border:1px solid rgba(27,29,24,.28);border-radius:3px;padding:7px 10px;cursor:pointer;backdrop-filter:blur(6px)}
.tb:hover{background:var(--paper);border-color:rgba(27,29,24,.6)}
.tb[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tb:focus-visible,.btn:focus-visible,.sp:focus-visible,.sw:focus-visible,.seg button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* herbarium label */
.tag{position:absolute;left:18px;bottom:18px;width:318px;background:var(--paper);color:var(--ink);border:1px solid var(--ink);padding:3px;pointer-events:none;box-shadow:0 6px 20px rgba(20,24,18,.18)}
.tag-in{border:1px solid rgba(27,29,24,.55);padding:10px 12px 10px}
.tag-top{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.tag-latin{font-family:var(--f-display);font-style:italic;font-size:24px;line-height:1.05;margin:8px 0 1px;text-wrap:balance}
.tag-latin small{font-style:normal;font-size:14px;opacity:.75;margin-left:4px}
.tag-common{font-size:12.5px;opacity:.8}
.tag-grid{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 10px;margin-top:9px;padding-top:8px;border-top:1px solid rgba(27,29,24,.35);font-family:var(--f-mono);font-size:10.5px;font-variant-numeric:tabular-nums}
.tag-grid dt{opacity:.6;text-transform:uppercase;letter-spacing:.06em;font-size:9.5px;align-self:center}
.tag-grid dd{margin:0}
.tag-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;font-family:var(--f-mono);font-size:9.5px;opacity:.85}
.stamp{color:var(--stamp);border:1.5px solid var(--stamp);padding:2px 6px;transform:rotate(-5deg);letter-spacing:.14em;text-transform:uppercase;font-weight:500;opacity:.9}
.busy{position:absolute;right:14px;bottom:18px;font-family:var(--f-mono);font-size:11px;color:var(--ink);background:rgba(242,240,230,.86);border:1px solid rgba(27,29,24,.3);padding:6px 9px;border-radius:3px;opacity:0;transition:opacity .15s;pointer-events:none}
.busy.on{opacity:1}
.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:12.5px;padding:8px 12px;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80%}
.toast.on{opacity:1}
.nogl{position:absolute;inset:0;display:none;place-items:center;color:var(--ink);font-size:15px;padding:30px;text-align:center}

/* panel */
#panel{overflow-y:auto;border-left:1px solid var(--line);background:var(--panel);min-height:0;scrollbar-color:var(--line) transparent}
.phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.phead .seg.style{flex-basis:100%}
.sub{display:grid;gap:3px}
.sub[hidden]{display:none}
.atlas{width:100%;aspect-ratio:1;display:block;border:1px solid var(--line);border-radius:3px;background:#0f130f;margin-top:6px}
.cap{font:400 10.5px var(--f-mono);color:var(--muted);letter-spacing:.04em;margin:2px 0 4px}
.phead label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.phead input{width:78px}
.phead .grow{flex:1}
input[type=number]{font:500 12.5px var(--f-mono);color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:5px 7px}
input[type=number]:focus{outline:2px solid var(--accent);outline-offset:0}
.btn{font:500 12px/1 var(--f-ui);color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:7px 10px;cursor:pointer;letter-spacing:.02em}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:#1d1609;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
details.sec{border-bottom:1px solid var(--line)}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:12px 16px 10px;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{margin:0;font:500 17px/1.1 var(--f-display);letter-spacing:.005em}
details.sec>summary .hint{color:var(--muted);font-size:11.5px;flex:1}
details.sec>summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg) translate(-1px,-1px)}
.body{padding:2px 16px 14px;display:grid;gap:3px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;align-items:center;gap:8px;min-height:24px}
[hidden]{display:none !important}
.row output{white-space:nowrap}
.row label{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row output{font:400 11.5px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.row select{grid-column:2 / 4}
select{font:500 12.5px var(--f-ui);color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:5px 6px}
select:focus{outline:2px solid var(--accent);outline-offset:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;--fill:50%}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--accent) var(--fill),var(--line) var(--fill))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);margin-top:-5px}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(226,162,58,.35)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.colors{display:grid;grid-template-columns:96px 1fr 1fr;gap:8px;align-items:center;min-height:28px}
.colors>span{color:var(--muted);font-size:12.5px}
.cpick{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
input[type=color]{-webkit-appearance:none;appearance:none;width:28px;height:22px;border:1px solid var(--line);border-radius:3px;background:none;padding:0;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:none;border-radius:2px}
input[type=color]::-moz-color-swatch{border:none;border-radius:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;font:500 12px/1 var(--f-ui);color:var(--muted);background:transparent;border:0;border-right:1px solid var(--line);padding:7px 6px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.seg button.dim{opacity:.5}
.segrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;min-height:30px}
.segrow>span{color:var(--muted);font-size:12.5px}
.species{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-top:2px}
.sp[hidden]{display:none}
.seg.groups{margin:2px 0 8px}
.seg.groups{display:grid;grid-template-columns:repeat(4,1fr)}
.seg.groups button{white-space:nowrap;padding:7px 1px;font-size:11.5px;min-width:0}
.seg.groups button:nth-child(-n+4){border-bottom:1px solid var(--line)}
.seg.groups button:nth-child(4){border-right:0}
.seg.groups small{color:var(--muted);font:400 9.5px var(--f-mono);margin-left:0}
.sp{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:3px;padding:7px 9px 8px;cursor:pointer;color:var(--text)}
.sp:hover{border-color:var(--muted)}
.sp[aria-pressed="true"]{border-left-color:var(--accent);background:#222a24}
.sp i{display:block;font:italic 400 14.5px/1.15 var(--f-display)}
.sp span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:2px 0 6px}
.sw{display:grid;gap:4px;justify-items:stretch;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:4px;cursor:pointer;color:var(--muted);font:500 11px var(--f-ui)}
.sw canvas{width:100%;aspect-ratio:1.4;display:block;border-radius:2px;background:#111511}
.sw[aria-pressed="true"]{border-color:var(--accent);color:var(--text)}
.sw:hover{border-color:var(--muted)}
.ticks{display:grid;grid-template-columns:96px 1fr 54px;gap:8px;margin-top:-6px}
.ticks div{display:flex;justify-content:space-between;font:400 9.5px var(--f-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:0 1px}
.note{color:var(--muted);font-size:11.5px;margin:4px 0 2px;max-width:60ch}
.adv{margin:10px 0 0;border-top:1px solid var(--line);padding-top:4px}
.adv>summary{cursor:pointer;list-style:none;font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.adv>summary::-webkit-details-marker{display:none}
.adv>summary::before{content:'+ ';color:var(--accent)}
.adv[open]>summary::before{content:'\2212  '}
.adv>.body{display:grid;gap:3px;padding-top:2px}
.gsub{font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px;padding-top:8px;border-top:1px solid var(--line)}
.agerow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.agerow .btn{min-width:74px}
.gstat{font:400 10.5px var(--f-mono);color:var(--muted);letter-spacing:.03em;margin:2px 0 4px}
.note.warn{color:#e8b866}
.lvtabs{margin:2px 0 6px}
.xgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.xgrid .wide{grid-column:1 / 3}
.fileinp{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:56% 44%}
  #panel{border-left:0;border-top:1px solid var(--line)}
  .brand h1{font-size:26px}
  .brand p{display:none}
  .toolbar{max-width:calc(100% - 140px)}
  .tb{padding:6px 8px;font-size:11.5px}
  .tag{width:auto;right:auto;max-width:calc(100% - 24px);left:12px;bottom:12px}
  .tag-latin{font-size:19px}
  .tag-grid{grid-template-columns:auto 1fr auto 1fr}
  .tag-foot{display:none}
}
@media (max-width:420px){
  .tag-grid,.tag-common{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="gl" tabindex="0" aria-label="3D tree viewport. Drag to orbit, right-drag or shift-drag to pan, scroll or pinch to zoom."></canvas>
    <div class="nogl" id="nogl">This viewer needs WebGL 2. Try a recent Chrome, Edge, Firefox or Safari.</div>
    <header class="brand">
      <a class="home" id="home" href="../index.html" hidden>← All tools</a>
      <h1>Lowtree</h1>
      <p>Procedural tree generator · drag to orbit · scroll to zoom</p>
    </header>
    <div class="toolbar" role="toolbar" aria-label="Viewport">
      <button class="tb" id="tb-frame" title="Frame the tree (F)">Frame</button>
      <button class="tb" id="tb-spin" aria-pressed="false" title="Turntable">Spin</button>
      <button class="tb" id="tb-wind" aria-pressed="true" title="Animate wind">Wind</button>
      <button class="tb" id="tb-leaves" aria-pressed="true" title="Show leaves">Leaves</button>
      <button class="tb" id="tb-wire" aria-pressed="false" title="Wireframe overlay">Wire</button>
    </div>
    <aside class="tag" aria-live="polite">
      <div class="tag-in">
        <div class="tag-top"><span>Lowtree herbarium</span><span id="t-no">No. 0423</span></div>
        <div class="tag-latin" id="t-latin">Quercus robur <small>L.</small></div>
        <div class="tag-common" id="t-common">English oak</div>
        <dl class="tag-grid">
          <dt>Height</dt><dd id="t-h">–</dd>
          <dt>DBH</dt><dd id="t-dbh">–</dd>
          <dt id="t-crown-l">Crown</dt><dd id="t-crown">–</dd>
          <dt id="t-leaves-l">Leaves</dt><dd id="t-leaves">–</dd>
          <dt>Branches</dt><dd id="t-br">–</dd>
          <dt>Tris</dt><dd id="t-tris">–</dd>
        </dl>
        <div class="tag-foot"><span id="t-date">Grown –</span><span class="stamp" id="t-stamp">Summer</span></div>
      </div>
    </aside>
    <div class="busy" id="busy">Growing…</div>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <section id="panel" aria-label="Tree settings">
    <div class="phead">
      <label for="seed">Seed</label>
      <input id="seed" type="number" min="0" max="99999" step="1" value="423">
      <button class="btn" id="reroll" title="New random seed (R)">Reroll</button>
      <span class="grow"></span>
      <button class="btn" id="reset" title="Reset to the selected species">Reset</button>
    </div>
    <div id="sections"></div>
  </section>
</div>

<script>
'use strict';
/* =====================================================================
   Lowtree — procedural tree generator (WebGL2, no dependencies)
   ===================================================================== */

// ---------- math ----------
const PI = Math.PI, TAU = PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const scale = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vlen = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const UP = [0, 1, 0];

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(a, b) {
  let h = Math.imul(a | 0, 0x9E3779B1) ^ Math.imul((b | 0) + 0x7F4A7C15, 0x85EBCA77);
  h ^= h >>> 15; h = Math.imul(h, 0xC2B2AE3D); h ^= h >>> 13;
  return h >>> 0;
}
function h2(x, y, s) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 982451653)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function randUnit(r) {
  const z = r() * 2 - 1, t = r() * TAU, s = Math.sqrt(1 - z * z);
  return [s * Math.cos(t), z, s * Math.sin(t)];
}
function perp(v) {
  const a = Math.abs(v[1]) < 0.9 ? UP : [1, 0, 0];
  return norm(cross(v, a));
}

// periodic value noise (for tileable textures)
function pnoise(x, y, px, py, s) {
  const ix = Math.floor(x), iy = Math.floor(y);
  let fx = x - ix, fy = y - iy;
  const x0 = ((ix % px) + px) % px, y0 = ((iy % py) + py) % py, x1 = (x0 + 1) % px, y1 = (y0 + 1) % py;
  const a = h2(x0, y0, s), b = h2(x1, y0, s), c = h2(x0, y1, s), d = h2(x1, y1, s);
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
function pfbm(u, v, fx, fy, oct, s) {
  let sum = 0, amp = 0.5, nrm = 0;
  for (let o = 0; o < oct; o++) {
    sum += amp * pnoise(u * fx, v * fy, fx, fy, s + o * 101);
    nrm += amp; amp *= 0.5; fx *= 2; fy *= 2;
  }
  return sum / nrm;
}
// periodic worley: out = [F1, F2, cellId]
function worley(u, v, cx, cy, seed, out) {
  const X = u * cx, Y = v * cy, ix = Math.floor(X), iy = Math.floor(Y);
  let f1 = 9, f2 = 9, id = 0;
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const gx = ix + i, gy = iy + j;
    const wx = ((gx % cx) + cx) % cx, wy = ((gy % cy) + cy) % cy;
    const dx = gx + h2(wx, wy, seed) - X, dy = gy + h2(wx, wy, seed + 17) - Y;
    const d = dx * dx + dy * dy;
    if (d < f1) { f2 = f1; f1 = d; id = h2(wx, wy, seed + 33); } else if (d < f2) f2 = d;
  }
  out[0] = Math.sqrt(f1); out[1] = Math.sqrt(f2); out[2] = id;
}
function vnoise3(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  let fx = x - ix, fy = y - iy, fz = z - iz;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const c = (a, b, d) => h2(a, b + Math.imul(d, 1619), 7);
  const x00 = lerp(c(ix, iy, iz), c(ix + 1, iy, iz), fx), x10 = lerp(c(ix, iy + 1, iz), c(ix + 1, iy + 1, iz), fx);

  return lerp(lerp(x00, x10, fy), lerp(x01, x11, fy), fz);
}

const SHAPES = [

];
const normShape = s => ({ tapered: 'hemispherical', flame: 'tendflame' })[s] || (SHAPES.some(x => x[0] === s) ? s : 'spherical');
function shapeRatio(shape, ratio) { // ratio: 1 at crown base, 0 at crown top
  switch (shape) {
    case 'conical': return 0.2 + 0.8 * ratio;
    case 'spherical': return 0.2 + 0.8 * Math.sin(PI * ratio);
    case 'hemispherical': return 0.2 + 0.8 * Math.sin(0.5 * PI * ratio);
    case 'cylindrical': return 1;
    case 'tapered': return 0.5 + 0.5 * ratio;
    case 'flame': return ratio <= 0.7 ? ratio / 0.7 : (1 - ratio) / 0.3;
    case 'inverse': return 1 - 0.8 * ratio;
    case 'tendflame': return ratio <= 0.7 ? 0.5 + 0.5 * ratio / 0.7 : 0.5 + 0.5 * (1 - ratio) / 0.3;
  }
  return 1;
}
